
services:
  localdrop:
    build: .
    container_name: localdrop

    ports:
      - "${LOCALDROP_HOST_PORT:-1516}:1516"

    volumes:
      - localdrop_data:/app/data

    environment:
      PORT: "1516"
      LOCALDROP_PORT: "1516"
      LOCALDROP_HOST: "0.0.0.0"
      # Set this to the host machine's LAN IP so QR codes work outside Docker.
      LOCALDROP_ADVERTISED_HOST: "${LOCALDROP_ADVERTISED_HOST:-}"

      LOCALDROP_STORAGE_DIR: /app/data/uploads
      LOCALDROP_DATABASE_PATH: /app/data/localdrop.db

      LOCALDROP_MAX_FILE_SIZE: "1073741824"
      LOCALDROP_MAX_CONCURRENT_UPLOADS: "3"

      LOCALDROP_FILE_EXPIRY_HOURS: "24"

      LOCALDROP_PAIRING_REQUIRED: "true"
      LOCALDROP_PAIRING_EXPIRATION_HOURS: "24"
      LOCALDROP_PAIRING_PIN: ""

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:1516/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  localdrop_data:
    driver: local
